name: Regenerate CM JSON

on:
  push:
    paths:
      - "CM/members.html"
      - "CM/banlist.html"
      - "scripts/generate_json.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate members.json and banlist.json
        run: python3 scripts/generate_json.py

      - name: Commit updated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CM/members.json CM/banlist.json
          git diff --cached --quiet || git commit -m "Auto-regenerate CM JSON from HTML"
          git push
